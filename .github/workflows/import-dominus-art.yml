name: Import DOMINUS cinematic illustrations
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-dominus-art.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download temporary Canva imagery into permanent repository assets
        shell: bash
        run: |
          mkdir -p assets/illustrations
          curl --fail --location --silent --show-error --retry 2 'https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F7633ddec-ea95-41d0-aea1-3bb00d232341/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAACocKg_xofbNAHTAGor7FG1QMGajxyHfwwGkqtd-u9En&exp=1794697301&osig=AAAAAAAAAAAAAAAAAAAAAANb3J_Nc243dhJBorZ1Z9bivM1PGxiPbLPzFKb-vp7H&signer=media-rpc&token=AAIAAU0AJDc2MzNkZGVjLWVhOTUtNDFkMC1hZWExLTNiYjAwZDIzMjM0MQAAAAABodxLjAjL5Ui6ON7GjAPcA-4-Q941SElVcIBVBy--VZyayMvUwQ&x-canva-quality=thumbnail' -o assets/illustrations/keyhole-illustration.png
          test $(wc -c < assets/illustrations/keyhole-illustration.png) -gt 1000
          curl --fail --location --silent --show-error --retry 2 'https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F2c3c7b90-1593-4556-a7d7-0d824d81de81/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAKrSGql6UB56EepVZPfsFYlhhvIuOhN73tZ2S-pQXo5_&exp=1794697339&osig=AAAAAAAAAAAAAAAAAAAAAIYiCGEHgdAfBSiPFzKDB14VdxvMMYPSVXxXw7k5wZeA&signer=media-rpc&token=AAIAAU0AJDJjM2M3YjkwLTE1OTMtNDU1Ni1hN2Q3LTBkODI0ZDgxZGU4MQAAAAABodxMIHiLvwjhAgDJq_e1cEPHCebfeuTndSKm2uMN8IUiyuXxIA&x-canva-quality=thumbnail' -o assets/illustrations/archive-illustration.png
          test $(wc -c < assets/illustrations/archive-illustration.png) -gt 1000
          curl --fail --location --silent --show-error --retry 2 'https://media.canva.com/v2/image-resize/format:PNG/height:112/quality:100/uri:ifs%3A%2F%2FM%2F7751b738-3b09-4d8e-9c7c-4573565c1340/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAItsugIT_oLu4qiCRTUd4k2gXsZ_fuPzCdHLWkJj5gBE&exp=1794698141&osig=AAAAAAAAAAAAAAAAAAAAACEaPtKPYDQdDc0ntjKdurZG5oTHXYUhoVid3OqDQDAw&signer=media-rpc&token=AAIAAU0AJDc3NTFiNzM4LTNiMDktNGQ4ZS05YzdjLTQ1NzM1NjVjMTM0MAAAAAABodxYXUgit4EmDV_lz4yb00UhmWBuj13eOFknkACWbk228PRR2g&x-canva-quality=thumbnail' -o assets/illustrations/ai-faith-illustration.png
          test $(wc -c < assets/illustrations/ai-faith-illustration.png) -gt 1000
          
      - name: Download official DE and FR front-cover thumbnails
        shell: bash
        run: |
          mkdir -p assets/illustrations
          curl --fail --location --silent --show-error --retry 2 'https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F5a616a9b-9856-4469-b026-b2697641636e/watermark:F/width:125?csig=AAAAAAAAAAAAAAAAAAAAAHRejVwLLT9W0Hz77iFAgpOHaRrxQ3eMmqgUDj7mLKac&exp=1794698165&osig=AAAAAAAAAAAAAAAAAAAAAH_NSb7KuCoN4ypxBebWTMoE5BKDvPZ8tGX0qPpJUxzC&signer=media-rpc&token=AAIAAU0AJDVhNjE2YTliLTk4NTYtNDQ2OS1iMDI2LWIyNjk3NjQxNjM2ZQAAAAABodxYuwjJO6t5Xe88z5coMgvZz9grqJe3X6Qvb2N3_XCc20Juwg&x-canva-quality=thumbnail' -o assets/illustrations/dominus-cover-de.jpg
          test $(wc -c < assets/illustrations/dominus-cover-de.jpg) -gt 1000
          curl --fail --location --silent --show-error --retry 2 'https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F7119d992-56e5-43a0-b7eb-b19cc0f480be/watermark:F/width:125?csig=AAAAAAAAAAAAAAAAAAAAACoPb98Y2stSluHr21mKlpRAbPIM7eKFnvYbPy83X7jf&exp=1794697825&osig=AAAAAAAAAAAAAAAAAAAAAPegqnHxGLYWwYecFdp0Qj0KieA_PMLXfmDBRCaf7DhQ&signer=media-rpc&token=AAIAAU0AJDcxMTlkOTkyLTU2ZTUtNDNhMC1iN2ViLWIxOWNjMGY0ODBiZQAAAAABodxTiujV_SV3-iU7lRwsee30VKElyEdm6DCAsXv-ZT2fjRwziA&x-canva-quality=thumbnail' -o assets/illustrations/dominus-cover-fr.jpg
          test $(wc -c < assets/illustrations/dominus-cover-fr.jpg) -gt 1000
      - name: Commit media
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/illustrations/
          if ! git diff --cached --quiet; then git commit -m 'Archive DOMINUS cinematic artwork'; git push; fi
