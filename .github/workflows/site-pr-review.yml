name: DOMINUS — multilingual pull request visual and link QA
on:
  pull_request:
    paths:
      - '**/*.html'
      - 'assets/**'
      - 'data/**'
      - 'i18n/**'
      - 'sitemap.xml'
      - '.github/workflows/site-pr-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multilingual:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve static files for QA only
        run: python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/dominus-http.log 2>&1 &
      - name: Validate 64 URLs, newsletter opt-in and screenshots
        run: |
          mkdir -p qa-artifacts
          node <<'JS'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const langs=['en','de','it','fr','es','pt-br','nl','pl'];
          const files=['','book-1.html','book-2.html','author.html','reading-order.html','editions.html','reader-resources.html','privacy.html'];
          (async()=>{
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const errors=[];
          for(const [mode,viewport] of Object.entries({mobile:{width:390,height:844},desktop:{width:1366,height:768}})){
            const context=await browser.newContext({viewport,reducedMotion:'reduce',deviceScaleFactor:1});
            for(const lang of langs)for(const file of files){
              const path='/'+lang+'/'+file, page=await context.newPage();
              page.on('pageerror',error=>errors.push(path+' JavaScript exception '+String(error.message).slice(0,180)));
              page.on('console',message=>{if(message.type()==='error')errors.push(path+' console error '+message.text().slice(0,180))});
              const response=await page.goto('http://127.0.0.1:8765'+path,{waitUntil:'networkidle'});
              if(!response||response.status()>=400)errors.push(path+' HTTP '+response?.status());
              const result=await page.evaluate(async()=>{
                const imgs=[...document.images];await Promise.all(imgs.map(async i=>{i.loading='eager';try{await i.decode()}catch(_){}}));
                const badImages=imgs.filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.src);
                const badAnchors=[...document.querySelectorAll('a[href^="#"]')].filter(a=>a.hash.length>1&&!document.getElementById(decodeURIComponent(a.hash.slice(1)))).map(a=>a.hash);
                const hasCanonical=!!document.querySelector('link[rel="canonical"]');
                const hreflangs=document.querySelectorAll('link[rel="alternate"][hreflang]').length;
                return {badImages,badAnchors,hasCanonical,hreflangs,overflow:document.documentElement.scrollWidth>innerWidth+5,forbidden:/Under review|Publishing — not yet confirmed live|KDP Select|Statuses recorded/.test(document.body.innerText)};
              });
              errors.push(...result.badImages.map(x=>path+' image missing '+x),...result.badAnchors.map(x=>path+' invalid anchor '+x));
              if(!result.hasCanonical||result.hreflangs<9)errors.push(path+' SEO metadata missing');
              if(result.overflow)errors.push(path+' horizontal overflow '+mode);
              if(result.forbidden)errors.push(path+' internal status in text');
                        const newsletter=page.locator('main .reader-optin');if(await newsletter.count()!==1)errors.push(path+' newsletter missing');else {const button=newsletter.locator('button[type="submit"]');if(!await button.isDisabled())errors.push(path+' newsletter must require explicit consent');await newsletter.locator('input[type="checkbox"]').check();if(!await button.isEnabled())errors.push(path+' consent checkbox failed');}
              if(!file||file==='reader-resources.html')await page.screenshot({path:'qa-artifacts/'+lang+'-'+mode+'.png',fullPage:true,animations:'disabled'});
              await page.close();
            }
            await context.close();
          }
          await browser.close();fs.writeFileSync('qa-artifacts/results.json',JSON.stringify({errors,urls:64,viewports:[390,1366]},null,2));
          if(errors.length){console.error(errors.join('\n'));process.exitCode=1}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Preserve review screenshots and findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dominus-multilingual-qa
          path: qa-artifacts/
          retention-days: 14
