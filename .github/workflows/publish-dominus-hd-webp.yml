name: Publish DOMINUS genuine HD web artwork
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/source/DOMINUS_HD_web_optimized.zip'
      - '.github/workflows/publish-dominus-hd-webp.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow for image verification
        run: python3 -m pip install --quiet --user Pillow
      - name: Validate and extract six genuine HD images
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s assets/source/DOMINUS_HD_web_optimized.zip ]; then
            echo "::notice::Upload the 1.3 MB DOMINUS_HD_web_optimized.zip into assets/source/ to publish the six HD art files."
            exit 0
          fi
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          from io import BytesIO
          from struct import unpack
          source=Path("assets/source/DOMINUS_HD_web_optimized.zip")
          expected={
            "portrait-salvatore-realistic.webp":(800,1000),
            "portrait-rafael-realistic.webp":(800,1000),
            "portrait-luiza-realistic.webp":(800,1000),
            "scene-corridor-realistic.webp":(1200,650),
            "scene-archive-realistic.webp":(1200,650),
            "scene-ai-realistic.webp":(1200,650)
          }
          output=Path("assets/illustrations")
          with ZipFile(source) as archive:
            assert set(archive.namelist())==set(expected), "Artwork archive contains unexpected or missing files"
            for name,(minimum_width,minimum_height) in expected.items():
              raw=archive.read(name)
              assert len(raw)>50000, f"{name} too small to be HD"
              assert raw[:4]==b'RIFF' and raw[8:12]==b'WEBP', f"{name} is not a WebP"
              from PIL import Image
              img=Image.open(BytesIO(raw))
              img.verify()
              img=Image.open(BytesIO(raw))
              assert img.width>=minimum_width and img.height>=minimum_height, f"{name} not genuine HD: {img.size}"
              (output/name).write_bytes(raw)
              print(f"{name}: {img.width}x{img.height}; {len(raw)} bytes")
          PY
      - name: Commit and publish
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/illustrations/*-realistic.webp
          if ! git diff --cached --quiet; then
            git commit -m 'Install original high-resolution DOMINUS portraits and story artwork'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
