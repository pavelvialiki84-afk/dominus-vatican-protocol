name: DOMINUS marketing readiness (no publication)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'marketing/packets.json'
      - 'scripts/marketing_packets.py'
      - 'test/test_marketing_packets.py'
      - '.github/workflows/marketing-readiness.yml'
  schedule:
    - cron: '15 7 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify approval boundaries
        run: python3 -m unittest discover -s test -p 'test_marketing_packets.py' -v
      - name: Generate preview and readiness report
        run: python3 scripts/marketing_packets.py
      - uses: actions/upload-artifact@v4
        with:
          name: dominus-marketing-readiness
          path: generated-marketing/
          retention-days: 14
