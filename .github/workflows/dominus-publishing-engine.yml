name: DOMINUS Publishing Engine — release control
on:
  workflow_dispatch:
  schedule:
    - cron: '25 7 * * 1'
  push:
    paths:
      - 'publishing-engine/catalogue.json'
      - 'scripts/publishing_audit.py'
      - '.github/workflows/dominus-publishing-engine.yml'
permissions:
  contents: read
jobs:
  publishing-control:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate edition metadata and export release board
        run: python3 scripts/publishing_audit.py
      - name: Archive audit CSV and readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dominus-publishing-readiness
          path: generated-publishing/
          if-no-files-found: warn
          retention-days: 30
