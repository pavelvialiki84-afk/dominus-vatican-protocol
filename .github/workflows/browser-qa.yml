name: DOMINUS browser visual QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/browser-qa.mjs'
      - 'world-atlas*.html'
      - 'assets/illustrations/portrait-*.webp'
      - '.github/workflows/browser-qa.yml'
  schedule:
    - cron: '42 7 * * 1'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Wait until GitHub Pages serves the updated HD portraits
        run: |
          for attempt in $(seq 1 36); do
            url="https://dominusbooks.com/world-atlas.html?qa_deploy=$GITHUB_SHA-$attempt"
            if curl --fail --silent --show-error --location "$url" | grep -q 'portrait-salvatore-realistic.webp?v=20261124-hd'; then
              echo "Updated atlas is publicly available"
              exit 0
            fi
            echo "Waiting for Pages deployment: attempt $attempt"
            sleep 10
          done
          echo "Latest HTML not publicly available" >&2
          exit 1
      - name: Execute desktop and mobile QA
        run: node scripts/browser-qa.mjs
      - name: Preserve screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dominus-browser-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
          retention-days: 14
