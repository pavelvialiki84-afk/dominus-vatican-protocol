name: DOMINUS browser visual QA
on:
  workflow_dispatch:
  schedule:
    - cron: '42 7 * * 1'
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Execute desktop and mobile QA
        run: node scripts/browser-qa.mjs
      - name: Preserve screenshots and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dominus-browser-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
          retention-days: 14
