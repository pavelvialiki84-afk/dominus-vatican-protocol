name: Install eight genuine HD illustrations and localized book covers
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/source/DOMINUS_SITE_HD_RELEASE.zip'
      - '.github/workflows/install-dominus-final-hd.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up image validation
        run: python3 -m pip install --user --quiet Pillow
      - name: Validate official artwork and prepare final site
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from io import BytesIO
          from PIL import Image
          import re

          archive = Path("assets/source/DOMINUS_SITE_HD_RELEASE.zip")
          if not archive.is_file():
              print("No HD release uploaded yet: leave existing site untouched.")
              raise SystemExit(0)
          expected = {
              "portrait-salvatore-realistic.webp": (900, 1125),
              "portrait-rafael-realistic.webp": (900, 1125),
              "portrait-luiza-realistic.webp": (900, 1125),
              "scene-corridor-realistic.webp": (1400, 788),
              "scene-archive-realistic.webp": (1400, 788),
              "scene-ai-realistic.webp": (1400, 788),
              "dominus-cover-de-hd.webp": (1000, 1600),
              "dominus-cover-fr-hd.webp": (1000, 1600)
          }
          output = Path("assets/illustrations")
          output.mkdir(parents=True,exist_ok=True)
          with ZipFile(archive) as zipped:
              if set(zipped.namelist()) != set(expected):
                  raise ValueError(f"Artwork mismatch: {set(zipped.namelist()) ^ set(expected)}")
              for name,(min_width,min_height) in expected.items():
                  data=zipped.read(name)
                  if data[:4] != b"RIFF" or data[8:12] != b"WEBP":
                      raise ValueError(f"Not WebP: {name}")
                  im=Image.open(BytesIO(data))
                  im.verify()
                  im=Image.open(BytesIO(data))
                  if im.width<min_width or im.height<min_height:
                      raise ValueError(f"Artwork below expected true-HD dimensions: {name} {im.size}")
                  (output/name).write_bytes(data)
                  print(f"VALIDATED {name}: {im.width} x {im.height}; {len(data)} bytes")

          root="https://pavelvialiki84-afk.github.io/dominus-vatican-protocol/"
          for lang,filename in (("de","dominus-band1-de.html"),("fr","dominus-volume1-fr.html")):
              path=Path(filename)
              html=path.read_text(encoding="utf-8")
              source=f"assets/illustrations/dominus-cover-{lang}.jpg"
              target=f"assets/illustrations/dominus-cover-{lang}-hd.webp"
              if source not in html:
                  if target not in html: raise ValueError(f"Neither old nor new cover exists in {filename}")
              else:
                  html=html.replace(source,target)
              # Update dimension metadata only for this book cover.
              old_tag=f'<img class="book-cover-image" src="{target}" width="125" height="200"'
              new_tag=f'<img class="book-cover-image" src="{target}" width="1000" height="1600"'
              if html.count(old_tag)!=1 and new_tag not in html:
                  raise ValueError(f"Cover dimension metadata mismatch in {filename}")
              html=html.replace(old_tag,new_tag)
              html=html.replace(root+"cover.png",root+target)
              path.write_text(html,encoding="utf-8")
          PY
      - name: Commit verified originals and localized cover markup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/illustrations/*-realistic.webp assets/illustrations/dominus-cover-*-hd.webp dominus-band1-de.html dominus-volume1-fr.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish genuine HD portraits, six-panel scenes and official DE FR covers'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
