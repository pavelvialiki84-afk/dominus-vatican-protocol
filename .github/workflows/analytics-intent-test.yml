name: DOMINUS analytics event contract
on:
  pull_request:
    paths:
      - 'assets/analytics.js'
      - 'test/analytics-intent.test.cjs'
      - '.github/workflows/analytics-intent-test.yml'
  push:
    branches: [main]
    paths:
      - 'assets/analytics.js'
      - 'test/analytics-intent.test.cjs'
      - '.github/workflows/analytics-intent-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-intent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify retailer intent classification
        run: node test/analytics-intent.test.cjs
