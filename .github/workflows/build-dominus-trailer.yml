name: Build DOMINUS 12-second book trailer
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-dominus-trailer.yml'
      - 'cover.png'
permissions:
  contents: write
jobs:
  trailer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install video encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Render silent 12-second MP4 from book artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          ffmpeg -hide_banner -loglevel error -y -loop 1 -framerate 24 -i cover.png \
            -vf "scale=1000:1500:force_original_aspect_ratio=increase,crop=960:540:(in_w-out_w)/2:(in_h-out_h)/2,eq=brightness=-0.045:saturation=0.90,format=yuv420p" \
            -t 12 -c:v libx264 -preset fast -crf 25 -movflags +faststart -pix_fmt yuv420p assets/dominus-trailer.mp4
          test -s assets/dominus-trailer.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 assets/dominus-trailer.mp4
      - name: Commit generated media
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dominus-trailer.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Build accessible 12-second DOMINUS MP4 teaser"
            git push
          fi
