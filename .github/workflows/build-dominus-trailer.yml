name: Build DOMINUS 12-second book trailer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trailer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install video encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Render 12-second music-backed MP4 from existing optimized assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          ffmpeg -hide_banner -loglevel error -y -loop 1 -framerate 24 -i assets/cover-en-600.jpg -i assets/dominus-score.mp3 \
            -vf "scale=1100:1600:force_original_aspect_ratio=increase,crop=1000:600,zoompan=z='min(zoom+0.0007,1.20)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=1:s=960x540:fps=24,eq=brightness=-0.045:saturation=0.90,format=yuv420p" \
            -t 12 -c:v libx264 -preset fast -crf 25 -c:a aac -b:a 128k -ar 44100 -movflags +faststart -pix_fmt yuv420p -shortest assets/dominus-trailer.mp4
          test -s assets/dominus-trailer.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 assets/dominus-trailer.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1 assets/dominus-trailer.mp4 | grep -q aac
      - name: Save trailer as review artifact (no automatic publishing)
        uses: actions/upload-artifact@v4
        with:
          name: dominus-trailer-preview
          path: assets/dominus-trailer.mp4
          retention-days: 7
