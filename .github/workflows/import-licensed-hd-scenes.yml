name: Import licensed HD archive references
on:
  push:
    paths:
      - '.github/workflows/import-licensed-hd-scenes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pillow
        run: python3 -m pip install --user Pillow
      - name: Fetch and validate original-resolution photographs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from io import BytesIO
          from PIL import Image, ImageOps, ImageEnhance
          files = {
            "scene-corridor-hd.webp": ("https://upload.wikimedia.org/wikipedia/commons/9/97/Interiors_of_Vatican_Secret_Archives.png",1100),
            "scene-archive-hd.webp": ("https://upload.wikimedia.org/wikipedia/commons/7/7e/Interiors_of_Vatican_Secret_Archives_B.png",1100),
            "scene-ai-hd.webp": ("https://upload.wikimedia.org/wikipedia/commons/5/51/Front_of_server_racks_at_NERSC.jpg",2500),
          }
          root=Path("assets/illustrations")
          root.mkdir(exist_ok=True,parents=True)
          for filename,(url,minwidth) in files.items():
            req=Request(url,headers={"User-Agent":"DOMINUSResearchCompanion/1.0 (editorial media; contact@dominusbooks.com)"})
            with urlopen(req,timeout=40) as response: data=response.read()
            img=Image.open(BytesIO(data));img.load()
            if img.width<minwidth:raise ValueError(f"Source not HD: {filename}, {img.size}")
            img=ImageOps.exif_transpose(img).convert("RGB")
            img.thumbnail((1600,1200),Image.Resampling.LANCZOS)
            img=ImageEnhance.Contrast(img).enhance(1.08)
            out=root/filename;img.save(out,"WEBP",quality=88,method=6)
            with Image.open(out) as check:
              assert check.width>=1000 and check.height>=600
            print(filename, img.size, out.stat().st_size)
          PY
      - name: Commit and publish HD assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/illustrations/scene-*-hd.webp
          if ! git diff --cached --quiet; then
            git commit -m "Host sharp licensed archive photo references as local WebP"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
